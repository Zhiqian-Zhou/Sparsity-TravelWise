# Deploy the docs/ folder to GitHub Pages on every push to main.
# Replaces the legacy "Deploy from a branch" Pages source with the modern
# Actions-based workflow (faster, supports custom build steps, no Jekyll).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skip queued runs in between
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Optional: smoke-check that the dashboard's data files exist before upload
      - name: Verify dashboard payload
        run: |
          set -e
          for f in docs/website/index.html \
                   docs/website/kg.html \
                   docs/website/css/styles.css \
                   docs/website/css/kg.css \
                   docs/website/js/app.js \
                   docs/website/js/kg.js \
                   docs/website/data/benchmark.json \
                   docs/website/data/kg_sample.json \
                   docs/website/data/stations.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "All dashboard files present."
          ls -lh docs/website/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
